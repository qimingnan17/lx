name: build-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "*.py"
      - "packaging/**"
      - "tests/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mitmproxy 2>&1 | tee -a build.log

      - name: Download ffmpeg
        run: |
          curl -sSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip -d ffmpeg_tmp
          mkdir -p ffmpeg
          cp ffmpeg_tmp/*/bin/ffmpeg.exe ffmpeg_tmp/*/bin/ffprobe.exe ffmpeg/
          cp ffmpeg_tmp/*/LICENSE.txt ffmpeg/LICENSE.txt || true

      - name: Test from source
        run: |
          set -o pipefail
          python tests/e2e_test.py 2>&1 | tee -a build.log

      - name: Build exe
        run: |
          set -o pipefail
          pyinstaller --noconfirm --distpath dist --workpath build packaging/plaso.spec 2>&1 | tail -n 60 | tee -a build.log
          cp -r ffmpeg dist/Plaso/ffmpeg
          cp README.md dist/Plaso/README.md

      - name: Test packaged exe
        run: |
          set -o pipefail
          python tests/e2e_test.py --exe dist/Plaso/plaso-cli.exe 2>&1 | tee -a build.log

      - name: Zip
        run: |
          cd dist
          7z a -tzip ../Plaso-win64.zip Plaso > /dev/null

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Plaso Windows build ${{ github.run_number }}
          body: |
            Windows 64 位打包版（含 ffmpeg / ffprobe）。解压后运行 Plaso.exe。
            Commit: ${{ github.sha }}
          files: Plaso-win64.zip

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 build.log > tail.log || echo "no log" > tail.log
          gh issue create --title "build-windows failed (run ${{ github.run_number }})" --body-file tail.log
